name: Build and Deploy

# Automatic flow (push to main):
#   1. Regular commit → patch bump committed back → triggers a second run → build + deploy
#   2. Bump commit (prefixed "chore: bump version") → build + deploy only
#
# Manual flow (workflow_dispatch):
#   Choose patch / minor / major → bump committed with [skip ci] → build + deploy in same run
#
# Requires a GH_PAT secret (classic PAT with "repo" scope, or fine-grained with
# "Contents: write"). The token owner must be allowed to bypass branch-protection
# push restrictions on main (Settings → Branches → add bypass exception for that user).

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version bump type'
        required: false
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  version-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          # PAT needed so the bump commit can push through branch protection.
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # ── Auto patch bump ──────────────────────────────────────────────────────
      # Runs on regular pushes only. Bumps patch, commits, and pushes — which
      # triggers a second workflow run that handles the actual build + deploy.
      - name: Auto patch bump
        if: "github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'chore: bump version')"
        run: |
          npm version patch --no-git-tag-version
          export NEW_VERSION=$(node -p "require('./package.json').version")
          export TODAY=$(date +%Y-%m-%d)
          python3 - <<'PYEOF'
          import os
          v, d = os.environ['NEW_VERSION'], os.environ['TODAY']
          new_block = (
              '## [Unreleased]\n\n'
              '### Added\n\n'
              '### Changed\n\n'
              '### Fixed\n\n'
              '### Removed\n\n'
          )
          path = 'CHANGELOG.md'
          text = open(path).read()
          open(path, 'w').write(text.replace('## [Unreleased]', new_block + f'## [{v}] - {d}', 1))
          PYEOF
          git add package.json package-lock.json CHANGELOG.md
          git commit -m "chore: bump version to v$NEW_VERSION"
          git push
          echo "SKIP_DEPLOY=true" >> $GITHUB_ENV

      # ── Manual bump (workflow_dispatch) ─────────────────────────────────────
      # Bumps to the chosen type. Uses [skip ci] so the resulting push does not
      # trigger a redundant second deploy run.
      - name: Manual version bump
        if: "github.event_name == 'workflow_dispatch'"
        run: |
          npm version ${{ github.event.inputs.bump_type }} --no-git-tag-version
          export NEW_VERSION=$(node -p "require('./package.json').version")
          export TODAY=$(date +%Y-%m-%d)
          python3 - <<'PYEOF'
          import os
          v, d = os.environ['NEW_VERSION'], os.environ['TODAY']
          new_block = (
              '## [Unreleased]\n\n'
              '### Added\n\n'
              '### Changed\n\n'
              '### Fixed\n\n'
              '### Removed\n\n'
          )
          path = 'CHANGELOG.md'
          text = open(path).read()
          open(path, 'w').write(text.replace('## [Unreleased]', new_block + f'## [{v}] - {d}', 1))
          PYEOF
          git add package.json package-lock.json CHANGELOG.md
          git commit -m "chore: bump version to v$NEW_VERSION [skip ci]"
          git push

      # ── Build & deploy ───────────────────────────────────────────────────────
      # Skipped after an auto patch bump (the next triggered run will deploy).
      # Runs on bump commits and manual dispatches.
      - run: npm ci
        if: env.SKIP_DEPLOY != 'true'

      # The tile/routing keys must be present at build time: Vite inlines them
      # into the bundle via `define` in vite.config.js. Without them the build
      # succeeds but ships an empty key, and routing silently makes no request.
      - run: npm run build
        if: env.SKIP_DEPLOY != 'true'
        env:
          VITE_THUNDERFOREST_API_KEY: ${{ secrets.VITE_THUNDERFOREST_API_KEY }}
          VITE_OPENROUTESERVICE_API_KEY: ${{ secrets.VITE_OPENROUTESERVICE_API_KEY }}

      - name: Install lftp
        if: env.SKIP_DEPLOY != 'true'
        run: sudo apt-get update && sudo apt-get install -y lftp ca-certificates

      # Connect using the hostname on the server's TLS certificate, not maphop.eu.
      # The host presents a valid DigiCert/Thawte-issued cert for *.your-server.de,
      # so connecting as maphop.eu fails hostname verification — that mismatch, not
      # a bad certificate, is why verification was previously turned off.
      - name: Deploy via lftp
        if: env.SKIP_DEPLOY != 'true'
        run: |
          if [ -z "${FTP_HOST}" ]; then
            echo "::error::FTP_HOST secret is not set. It must be the hostname on the server's"
            echo "::error::TLS certificate (e.g. wXXXXXXX.your-server.de), taken from the hosting"
            echo "::error::panel. maphop.eu is not covered by that certificate."
            exit 1
          fi
          lftp -c "
            set net:max-retries 3;
            set net:timeout 20;
            set ftp:passive-mode true;
            set ssl:verify-certificate true;
            set ftp:ssl-allow true;
            set ftp:ssl-force true;
            set ftp:ssl-protect-data yes;
            open -u ${FTP_USER},${FTP_PASSWORD} -p 21 ${FTP_HOST};
            mirror --reverse --delete --verbose ./dist/ ./public_html/;
            bye;
          "
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}

      # ── Tag and GitHub release ───────────────────────────────────────────────
      # Runs after a successful deploy. Extracts the matching CHANGELOG section
      # as release notes, tags the bump commit, and publishes as the latest release.
      - name: Tag and publish GitHub release
        if: env.SKIP_DEPLOY != 'true'
        run: |
          export VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"

          NOTES=$(python3 - <<'PYEOF'
          import re, os
          ver = os.environ['VERSION']
          text = open('CHANGELOG.md').read()
          m = re.search(
              r'## \[' + re.escape(ver) + r'\][^\n]*\n(.*?)(?=\n## \[|\Z)',
              text, re.DOTALL
          )
          print(m.group(1).strip() if m else f'Release {ver}')
          PYEOF
          )

          git tag "$TAG" || true
          git push origin "$TAG" || true
          gh release view "$TAG" &>/dev/null \
            && gh release edit "$TAG" --latest \
            || gh release create "$TAG" --latest --title "Release $TAG" --notes "$NOTES"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
