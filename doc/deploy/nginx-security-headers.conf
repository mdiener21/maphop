# Maphop — production security headers (nginx)
#
# The site is deployed by mirroring `dist/` over FTPS into `public_html/`, so
# these directives CANNOT be shipped from the repo — nginx only reads its own
# server config. Paste this block into the `server { ... }` block for
# maphop.eu (or the hosting panel's custom-headers field) and reload nginx.
#
# Verify afterwards:
#   curl -sSI https://maphop.eu/ | grep -iE 'strict-transport|x-content-type|x-frame|referrer|permissions|content-security'
#
# A previous `_headers` file (Netlify/Cloudflare Pages syntax) lived in
# src/public/ and was silently ignored by this host — it has been removed.

# Force HTTPS for two years, including subdomains. Only enable `preload` once
# you are certain every subdomain can serve HTTPS permanently.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

# Block MIME-type sniffing on the mirrored assets.
add_header X-Content-Type-Options "nosniff" always;

# Clickjacking protection. `frame-ancestors` is the modern form and is the
# reason this must be an HTTP header: browsers ignore it in a <meta> CSP,
# so the per-page meta policies in src/*.html cannot cover it.
add_header X-Frame-Options "DENY" always;
add_header Content-Security-Policy "frame-ancestors 'none'" always;

# Matches the per-page <meta name="referrer"> policies.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Geolocation stays available to the app itself; everything else is denied.
add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=(), usb=()" always;

# Note: `add_header` in nginx is not inherited by a nested location block that
# declares its own add_header. If any location{} here sets headers, repeat
# these directives inside it.
